<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance Premium Predictor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#3f87ff,#6a11cb);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{

    width:500px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);

}

h2{

    text-align:center;
    margin-bottom:20px;
    color:#333;

}

label{

    display:block;
    margin-top:15px;
    font-weight:bold;

}

input,select{

    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;

}

button{

    width:100%;
    margin-top:25px;
    padding:12px;
    background:#3f87ff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:17px;
    transition:.3s;

}

button:hover{

    background:#2563eb;

}

#result{

    margin-top:25px;
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    display:none;

}

.success{

    color:green;
    font-weight:bold;
    font-size:20px;

}

.error{

    color:red;
    font-weight:bold;

}

.loading{

    text-align:center;
    display:none;
    margin-top:15px;
    color:#444;

}

pre{

    background:#eee;
    padding:10px;
    border-radius:8px;
    overflow:auto;

}

</style>

</head>

<body>

<div class="container">

<h2>Insurance Premium Predictor</h2>

<label>Age</label>
<input type="number" id="age">

<label>Weight (kg)</label>
<input type="number" step="0.1" id="weight">

<label>Height (meters)</label>
<input type="number" step="0.01" id="height" placeholder="Example: 1.72">

<label>Annual Income (LPA)</label>
<input type="number" step="0.1" id="income">

<label>Smoker</label>

<select id="smoker">
<option value="false">No</option>
<option value="true">Yes</option>
</select>

<label>City</label>
<input type="text" id="city">

<label>Occupation</label>

<select id="occupation">

<option value="student">Student</option>
<option value="private_job">Private Job</option>
<option value="government_job">Government Job</option>
<option value="business_owner">Business Owner</option>
<option value="freelancer">Freelancer</option>
<option value="retired">Retired</option>
<option value="unemployed">Unemployed</option>

</select>

<button onclick="predict()">Predict Premium</button>

<div class="loading" id="loading">
Please wait...
</div>

<div id="result"></div>

</div>

<script>

const API_URL="http://127.0.0.1:8000/predict";

async function predict(){

document.getElementById("loading").style.display="block";

document.getElementById("result").style.display="none";

const data={

age:Number(document.getElementById("age").value),

weight:Number(document.getElementById("weight").value),

height:Number(document.getElementById("height").value),

income_lpa:Number(document.getElementById("income").value),

smoker:document.getElementById("smoker").value==="true",

city:document.getElementById("city").value,

occupation:document.getElementById("occupation").value

};

try{

const response=await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

});

const result=await response.json();

document.getElementById("loading").style.display="none";

let html="";

if(response.ok){

html = `
<h3>Prediction Result</h3>
<p class="success">
Predicted Insurance Premium Category:
<b>${result.Predicted_content}</b>
</p>
`;

}
else{

html=`<p class="error">API Error</p>
<pre>${JSON.stringify(result,null,2)}</pre>`;

}

document.getElementById("result").style.display="block";
document.getElementById("result").innerHTML=html;

}

catch(error){

document.getElementById("loading").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=
`<p class="error">
Could not connect to FastAPI Server.
<br><br>
${error}
</p>`;

}

}

</script>

</body>
</html>
